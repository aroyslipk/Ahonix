version: "3.8"

services:
  mongo:
    image: mongo:7.0
    container_name: ahonix-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ahonix-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGO_URL=mongodb://mongo:27017
      - DB_NAME=ahonix_db
      - CORS_ORIGINS=http://localhost:3000,http://localhost:80,http://127.0.0.1:3000
      - FRONTEND_URL=http://localhost:3000
      - APP_URL=http://localhost:3000
      - JWT_SECRET=dev-secret-key-32-bytes-minimum-length-for-testing
      - ADMIN_EMAIL=alex@northstargoods.com
      - ADMIN_PASSWORD=Ahonix2026!
      - EMERGENT_LLM_KEY=
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_BACKEND_URL=http://localhost:8000
    container_name: ahonix-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo_data:
    driver: local
